# sylvania-smart-plus-wifi-plug.yaml

# Board: Generic - BK7231T (Tuya QFN32)

substitutions:
  id: Sylvania Plug
  hostname: sylvania-smart-plus-wifi-plug

esphome:
  name: ${hostname}
  friendly_name: ${id}

bk72xx:
  board: generic-bk7231t-qfn32-tuya

logger:
  level: WARN

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${id} Fallback Hotspot

captive_portal:

text_sensor:
  - platform: libretiny

binary_sensor:
  - platform: gpio
    name: Button
    pin:
      number: P11
      inverted: true
      mode:
        pullup: true
        input: true
    id: binary_sensor_gpio_1
    trigger_on_initial_state: false
    on_press:
      - then:
          - switch.toggle: switch_gpio_1
    icon: "mdi:button-pointer"
switch:
  - platform: gpio
    name: Switch
    pin: P26
    id: switch_gpio_1
    on_state:
      - then:
          - if:
              condition:
                switch.is_on: switch_gpio_1
              then:
                - light.turn_on: light_status_led_1
              else:
                - light.turn_off: light_status_led_1
light:
  - platform: status_led
    name: Light
    id: light_status_led_1
    pin:
      number: P6
      inverted: true
    icon: "mdi:led-off"